<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Test</title>
</head>
<body>
<h2>Button Test</h2>
<button id="btn1" onclick="alert('inline onclick works')">Test 1: inline onclick</button>
<br><br>
<button id="btn2">Test 2: addEventListener</button>
<br><br>
<div id="result" style="padding:20px;background:#eee;margin-top:20px;">Tap a button</div>
<script>
document.getElementById('btn2').addEventListener('click', function(){
  document.getElementById('result').textContent = 'addEventListener works! Time: ' + new Date().toLocaleTimeString();
});
window.onerror = function(msg, src, line){
  document.getElementById('result').textContent = 'JS ERROR: ' + msg + ' line ' + line;
  return true;
};
</script>
</body>
</html>
